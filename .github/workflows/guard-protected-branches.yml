name: Guard protected branches

on:
  pull_request:
    branches: [main, producao]

jobs:
  check-source-branch:
    name: Source branch must be dev
    runs-on: ubuntu-latest

    steps:
      # `dev` carries the code into both. Documentation changes nothing that
      # runs, so a `docs/` branch reaches `main` on its own — but never
      # `producao`, which is what is deployed.
      - name: Reject pull requests from a branch that may not open one
        if: >-
          github.head_ref != 'dev' &&
          !(github.base_ref == 'main' && startsWith(github.head_ref, 'docs/'))
        run: |
          echo "::error::Pull requests into '${{ github.base_ref }}' must come from 'dev'."
          echo "Into 'main', a branch named 'docs/...' may open one as well."
          echo "This one comes from '${{ github.head_ref }}'."
          exit 1

      - name: Approve
        run: echo "Source branch is '${{ github.head_ref }}'."
