name: Deploy — dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/praxis-fatec/case-law-backend
  REMOTE_DIR: case-law-dev

jobs:
  deploy:
    name: Build the image and release it to the development server
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Prepare the SSH credentials
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_HOST_KEY: ${{ secrets.PI_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PI_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s %s\n' "$PI_HOST" "$PI_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload the deployment files
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          ssh -i ~/.ssh/deploy "$PI_USER@$PI_HOST" "mkdir -p ~/$REMOTE_DIR"
          scp -i ~/.ssh/deploy deploy/docker-compose.dev.yml "$PI_USER@$PI_HOST:~/$REMOTE_DIR/docker-compose.yml"
          scp -i ~/.ssh/deploy deploy/release.sh "$PI_USER@$PI_HOST:~/$REMOTE_DIR/release.sh"
          scp -i ~/.ssh/deploy infra/postgres/init.sql "$PI_USER@$PI_HOST:~/$REMOTE_DIR/init.sql"

      - name: Authenticate the development server against the registry
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy "$PI_USER@$PI_HOST" \
            "docker login ghcr.io --username ${{ github.actor }} --password-stdin"

      - name: Release and check that the API answers
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
        run: |
          ssh -i ~/.ssh/deploy "$PI_USER@$PI_HOST" "bash ~/$REMOTE_DIR/release.sh"
