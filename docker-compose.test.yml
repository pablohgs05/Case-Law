name: case-law-tests
services:
  postgres-test:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: caselaw_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: caselaw_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caselaw_test -d caselaw_test"]
      interval: 2s
      timeout: 5s
      retries: 30
