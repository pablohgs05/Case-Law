server {
    listen 80;
    listen [::]:80;
    server_name dev.jurisfonte.pedrohenribeiro.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.jurisfonte.pedrohenribeiro.com;

    ssl_certificate     /etc/letsencrypt/live/jurisfonte.pedrohenribeiro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jurisfonte.pedrohenribeiro.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic "Case Law — desenvolvimento";
    auth_basic_user_file /etc/nginx/jurisfonte-dev.htpasswd;

    client_max_body_size 2m;

    location /api/ {
        limit_req zone=jurisfonte_api burst=40 nodelay;

        proxy_pass http://__DEVELOPMENT_BACKEND__/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://__DEVELOPMENT_FRONTEND__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
