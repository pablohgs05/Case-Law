name: Deploy — producao

on:
  push:
    branches: [producao]
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/praxis-fatec/case-law-backend
  REMOTE_DIR: case-law-prod

jobs:
  build:
    name: Build the backend image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:producao
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release to the production server
    runs-on: ubuntu-latest
    needs: build
    environment: producao

    steps:
      - uses: actions/checkout@v4

      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Prepare the SSH credentials
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload the deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy "$VPS_USER@$VPS_HOST" "mkdir -p ~/$REMOTE_DIR"
          scp -i ~/.ssh/deploy deploy/docker-compose.prod.yml "$VPS_USER@$VPS_HOST:~/$REMOTE_DIR/docker-compose.yml"
          scp -i ~/.ssh/deploy deploy/release.sh "$VPS_USER@$VPS_HOST:~/$REMOTE_DIR/release.sh"
          scp -i ~/.ssh/deploy infra/postgres/init.sql "$VPS_USER@$VPS_HOST:~/$REMOTE_DIR/init.sql"

      - name: Authenticate the production server against the registry
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io --username ${{ github.actor }} --password-stdin"

      - name: Release and check that the API answers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy "$VPS_USER@$VPS_HOST" \
            "BACKEND_IMAGE='$IMAGE:${{ github.sha }}' PRUNE_IMAGES=false bash ~/$REMOTE_DIR/release.sh"
